name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-api.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests -v

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build the image
        run: docker build -t credit-risk-api .
      - name: Start the container
        run: docker run -d --name api -p 8000:8000 credit-risk-api
      - name: Smoke test the API
        run: |
          curl --retry 15 --retry-delay 2 --retry-connrefused --fail http://localhost:8000/health
          curl --fail -s -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"age_years":29,"annual_income":150000,"loan_amount":450000,"loan_annuity":22000}' \
            | tee response.json
          grep -q default_probability response.json
      - name: Show container logs if something failed
        if: failure()
        run: docker logs api